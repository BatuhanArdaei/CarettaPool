# main'e her push'ta siteyi Hetzner sunucusuna yayınlar.
# Gerekli repo secret'ları (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         sunucu IP'si (2.31.118.229)
#   DEPLOY_SSH_KEY      `caretta` kullanıcısına tanımlı özel SSH anahtarı
#   DEPLOY_KNOWN_HOSTS  `ssh-keyscan 2.31.118.229` çıktısı
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: SSH ayarları
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Gönder ve yayınla
        env:
          TARGET: caretta@${{ secrets.DEPLOY_HOST }}
        run: |
          RELEASE="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          git archive --format=tar HEAD | ssh "$TARGET" "mkdir -p /var/www/caretta-pool/releases/$RELEASE && tar -x -C /var/www/caretta-pool/releases/$RELEASE"
          ssh "$TARGET" "bash /var/www/caretta-pool/releases/$RELEASE/scripts/server-deploy.sh $RELEASE"
